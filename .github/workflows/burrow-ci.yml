name: Burrow CI

on:
  pull_request:
    paths:
      - "apps/burrow/**"
      - ".github/workflows/burrow-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/burrow/**"
      - ".github/workflows/burrow-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/burrow
    steps:
      - name: Select pinned Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
        working-directory: .
      - name: Emit toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
        working-directory: .
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test, bundle pinned engine, and verify
        run: ./scripts/ci.sh
